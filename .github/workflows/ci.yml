name: CI

on:
  push:
  pull_request:

jobs:
  pint:
    name: Code style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/pint --test

  tests:
    name: Tests
    runs-on: ubuntu-latest

    # The same PostgreSQL version as Lando and Laravel Cloud. The tests use
    # the beach_ready_testing database; see decision 0001.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: beach_ready_testing
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # phpunit.xml points at Lando's database host. A real environment
    # variable takes precedence over it, so this is the only override.
    env:
      DB_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment file
        run: |
          cp .env.example .env
          php artisan key:generate

      # Runs every suite in phpunit.xml: Unit, Feature and Concurrency.
      - run: php artisan test

  frontend:
    name: Front end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Vitest: the client-side logic and components.
      - run: npm test

      # The same production build Laravel Cloud runs.
      - run: npm run build
